# Maintainer DX: copy to docker-compose.yml (gitignored).
# Sibling repos under /var/www/concept + COMPOSER=composer-dev.json (path repos / symlinks).
#
#   cp docker-compose.dev.yml.example docker-compose.yml
#   cp apps/bff/composer-dev.json.example apps/bff/composer-dev.json
#   cp apps/bff/.env.example apps/bff/.env
#   cp apps/api/composer-dev.json.example apps/api/composer-dev.json
#   cp apps/api/.env.example apps/api/.env
#   cp apps/web/composer-dev.json.example apps/web/composer-dev.json
#   cp apps/web/.env.example apps/web/.env
#   cp apps/cli/composer-dev.json.example apps/cli/composer-dev.json
#   cp apps/cli/.env.example apps/cli/.env
#   docker compose up -d --build
#   docker compose exec bff composer install
#   docker compose exec api composer install
#   docker compose exec web composer install
#   docker compose exec cli composer install
services:
  php:
    build: .
    container_name: concept_apps_php
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ../concept-core-2:/var/www/concept-core-2
      - ../concept-stack:/var/www/concept-stack
      - ../concept-extensions:/var/www/concept-extensions
      - ../concept-bricks:/var/www/concept-bricks
      - ./docker/php/error-reporting.ini:/usr/local/etc/php/conf.d/error-reporting.ini
    environment:
      - COMPOSER=composer-dev.json
    depends_on:
      - db

  bff:
    build: .
    container_name: concept_apps_bff
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html/apps/bff
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ../concept-core-2:/var/www/concept-core-2
      - ../concept-stack:/var/www/concept-stack
      - ../concept-extensions:/var/www/concept-extensions
      - ../concept-bricks:/var/www/concept-bricks
      - ./docker/apache/vhost-bff.conf:/etc/apache2/sites-available/000-default.conf
      - ./docker/php/error-reporting.ini:/usr/local/etc/php/conf.d/error-reporting.ini
    environment:
      COMPOSER: composer-dev.json
    depends_on:
      - db

  api:
    build: .
    container_name: concept_apps_api
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html/apps/api
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ../concept-core-2:/var/www/concept-core-2
      - ../concept-stack:/var/www/concept-stack
      - ../concept-extensions:/var/www/concept-extensions
      - ../concept-bricks:/var/www/concept-bricks
      - ./docker/apache/vhost-api.conf:/etc/apache2/sites-available/000-default.conf
      - ./docker/php/error-reporting.ini:/usr/local/etc/php/conf.d/error-reporting.ini
    environment:
      COMPOSER: composer-dev.json
    depends_on:
      - db

  web:
    build: .
    container_name: concept_apps_web
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html/apps/web
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ../concept-core-2:/var/www/concept-core-2
      - ../concept-stack:/var/www/concept-stack
      - ../concept-extensions:/var/www/concept-extensions
      - ../concept-bricks:/var/www/concept-bricks
      - ./docker/apache/vhost-web.conf:/etc/apache2/sites-available/000-default.conf
      - ./docker/php/error-reporting.ini:/usr/local/etc/php/conf.d/error-reporting.ini
    environment:
      COMPOSER: composer-dev.json
    depends_on:
      - db

  cli:
    build: .
    container_name: concept_apps_cli
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html/apps/cli
    volumes:
      - .:/var/www/html
      - ../concept-core-2:/var/www/concept-core-2
      - ../concept-stack:/var/www/concept-stack
      - ../concept-extensions:/var/www/concept-extensions
      - ../concept-bricks:/var/www/concept-bricks
      - ./docker/php/error-reporting.ini:/usr/local/etc/php/conf.d/error-reporting.ini
    environment:
      COMPOSER: composer-dev.json
    depends_on:
      - db

  worker:
    build: .
    container_name: concept_apps_worker
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html/apps/worker
    volumes:
      - .:/var/www/html
      - ../concept-core-2:/var/www/concept-core-2
      - ../concept-stack:/var/www/concept-stack
      - ../concept-extensions:/var/www/concept-extensions
      - ../concept-bricks:/var/www/concept-bricks
      - ./docker/php/error-reporting.ini:/usr/local/etc/php/conf.d/error-reporting.ini
    environment:
      COMPOSER: composer-dev.json
    depends_on:
      - db

  db:
    image: mysql:8.4
    command: --mysql-native-password=ON
    container_name: concept_apps_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: concept_api
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
